  /* ===== Design tokens (taste-skill, redesign-preserve) =====
     Accent duy nhất: #2563EB, dùng y hệt khắp trang.
     Bo góc: nút/chip/tab 12px (pill chỉ cho badge đếm nhỏ); thẻ/modal 18px; dòng bài 14px.
     Màu môn pastel + chữ đậm sẫm GIỮ NGUYÊN theo ý chủ. Không dark mode (chủ đã chốt bảng sáng). */
  :root{
    --bg:#F6F8FC; --card:#FFFFFF; --ink:#1A2332; --muted:#5B6B82;
    --accent:#2563EB; --accent-soft:#EAF1FE; --line:#E3E9F2;
    --red:#DC2626; --red-soft:#FDECEC; --orange:#D97706; --orange-soft:#FDF3E3;
    --green:#15803D; --green-soft:#E7F6EC; --gray-soft:#EEF2F7;
    --shadow:0 1px 2px rgba(26,35,50,.05),0 6px 20px rgba(26,35,50,.05);
    --ring:0 0 0 3px rgba(37,99,235,.18);
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  html,body{overflow-x:hidden; overflow-x:clip}
  body{font-family:"Be Vietnam Pro",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5}
  .wrap{max-width:1080px; margin:0 auto; padding:16px 16px 56px}
  .chipstat b, .recallbox .pct, .d-stat .vl, .dist-row .num{font-variant-numeric:tabular-nums}
  ::placeholder{color:#6B7688; opacity:1}

  /* ===== Header ===== */
  header.top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:6px 0 12px}
  .title{display:flex; align-items:center; gap:9px; font-size:20px; font-weight:800; letter-spacing:-.01em; margin-right:auto}
  .title svg{flex:none}
  .hbtns{display:flex; gap:8px; flex-wrap:wrap}
  .btn{appearance:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
    font:inherit; font-weight:600; font-size:14px; padding:9px 16px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:transform .15s ease, background .15s ease, border-color .15s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.small{padding:7px 13px; font-size:13px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; width:100%}
  .chipstat{display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:6px 13px; font-size:13.5px; color:var(--muted); white-space:nowrap}
  .chipstat b{font-size:16px; color:var(--ink); font-weight:800}
  .chipstat .n-blue{color:var(--accent)} .chipstat .n-orange{color:var(--orange)} .chipstat .n-red{color:var(--red)}
  #notice{display:none; background:#FFF7E6; border:1px solid #F3DFAE; color:#7A5410; border-radius:12px;
    padding:9px 13px; font-size:13.5px; margin:2px 0 10px}
  #notice.show{display:block}

  /* ===== Tab bar ===== */
  .tabbar{position:sticky; top:10px; z-index:30; background:#E8EDF5; border-radius:16px; padding:5px;
    display:flex; gap:4px; box-shadow:var(--shadow); margin:4px 0 16px}
  .tabbtn{flex:1; min-width:0; appearance:none; border:0; background:transparent; font:inherit; font-weight:600; font-size:14.5px;
    color:var(--muted); padding:9px 6px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center;
    justify-content:center; gap:7px; transition:all .25s ease; white-space:nowrap}
  .tabbtn .cnt{background:var(--red); color:#fff; font-size:11.5px; font-weight:700; border-radius:999px; padding:1px 7px}
  .tabbtn.active{background:#fff; color:var(--accent); box-shadow:0 2px 8px rgba(26,35,50,.13)}
  section.tabpane{display:none}
  section.tabpane.active{display:block; animation:paneIn .3s ease both}
  @keyframes paneIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* ===== Cards & summary blocks ===== */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
  .card h3{margin:0 0 12px; font-size:16px; font-weight:700}
  .summary-grid{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px}
  @media(min-width:760px){ .summary-grid{grid-template-columns:1fr 1fr} }
  .dist-row{display:flex; align-items:center; gap:10px; margin:7px 0}
  .dist-row .bar{flex:1; height:9px; background:var(--gray-soft); border-radius:99px; overflow:hidden}
  .dist-row .bar i{display:block; height:100%; border-radius:99px; width:0; transition:none}
  .dist-row .num{font-weight:700; min-width:26px; text-align:right}
  .sumline{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; color:var(--muted)}
  .sumline b{font-size:15px}
  .linklike{color:var(--accent); font-weight:600; cursor:pointer; background:none; border:0; font:inherit; padding:6px 0 0}

  /* ===== Rows ===== */
  .grouphead{display:flex; align-items:center; gap:9px; margin:18px 2px 8px; font-weight:700}
  .grouphead .gcount{color:var(--muted); font-weight:500; font-size:13.5px}
  .subj{display:inline-flex; align-items:center; font-weight:700; font-size:13px; padding:3px 11px; border-radius:8px; white-space:nowrap}
  .rows{display:flex; flex-direction:column; gap:8px}
  .row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:11px 14px; cursor:pointer; font:inherit; color:inherit;
    box-shadow:0 1px 2px rgba(26,35,50,.05); transition:transform .15s ease, box-shadow .15s ease}
  .row:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
  .row:active{transform:scale(.99)}
  .row-main{flex:1; min-width:0}
  .row-topic{display:block; font-weight:600; font-size:15px; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .row-sub{display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap}
  .badge{font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap}
  .badge-over{background:var(--red-soft); color:var(--red)}
  .badge-today{background:var(--orange-soft); color:var(--orange)}
  .badge-wait{background:var(--gray-soft); color:var(--muted)}
  .duetxt{font-size:13px; color:var(--muted); white-space:nowrap}
  .recallbox{flex:none; width:86px; text-align:right}
  .recallbox .pct{font-weight:800; font-size:15px}
  .recallbox .bar{height:6px; background:var(--gray-soft); border-radius:99px; overflow:hidden; margin-top:4px}
  .recallbox .bar i{display:block; height:100%; border-radius:99px; width:0; transition:none}
  .urgent{border:1.5px solid #F5C6C6; background:linear-gradient(180deg,#FFF7F7,#fff)}
  .urgent .utag{display:inline-flex; align-items:center; gap:6px; color:var(--red); font-weight:800; font-size:13px; letter-spacing:.02em; margin-bottom:6px}
  .fade-up{animation:fadeUp .25s ease both}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .empty{color:var(--muted); text-align:center; padding:26px 10px}

  /* ===== All tab toolbar ===== */
  .toolbar{position:sticky; top:66px; z-index:20; background:var(--bg); padding:8px 0 10px}
  .search{width:100%; font:inherit; padding:11px 15px; border-radius:13px; border:1px solid var(--line); background:#fff; box-shadow:var(--shadow); outline:none}
  .search:focus{border-color:var(--accent); box-shadow:var(--ring)}
  .filters{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; align-items:center}
  .fchip{appearance:none; border:1px solid var(--line); background:#fff; font:inherit; font-size:13px; font-weight:600;
    padding:6px 12px; border-radius:999px; cursor:pointer; color:var(--muted)}
  .fchip.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .filters select{font:inherit; font-size:13.5px; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink)}
  .addbtn{margin-left:auto}

  /* ===== Note & footer ===== */
  .note{margin-top:20px; background:var(--accent-soft); border:1px solid #CFE0FB; border-radius:var(--radius); padding:15px 16px}
  .note h4{margin:0 0 6px; font-size:15px}
  .note p{margin:0 0 10px; color:#33507E; font-size:14px}

  /* ===== Modal ===== */
  .overlay{position:fixed; inset:0; background:rgba(20,28,45,.45); z-index:60; display:none; align-items:flex-end; justify-content:center; padding:0}
  @media(min-width:700px){ .overlay{align-items:center; padding:20px} }
  .overlay.open{display:flex}
  .modal{background:#fff; width:100%; max-width:620px; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:20px;
    animation:modalIn .28s cubic-bezier(.22,.9,.3,1.2) both}
  @media(min-width:700px){ .modal{border-radius:18px} }
  @keyframes modalIn{from{opacity:0; transform:scale(.94) translateY(14px)} to{opacity:1; transform:none}}
  .modal h3{margin:0 30px 4px 0; font-size:18px; line-height:1.35}
  .xbtn{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#fff; font-size:16px; cursor:pointer; color:var(--muted)}
  .modalwrap{position:relative}
  .kv{display:grid; grid-template-columns:128px 1fr; gap:6px 12px; margin-top:14px; font-size:14px}
  .kv dt{color:var(--muted)} .kv dd{margin:0; font-weight:500; white-space:pre-wrap; word-break:break-word}
  .hist{background:var(--gray-soft); border-radius:12px; padding:10px 12px; margin-top:4px; white-space:pre-wrap; font-size:13.5px}
  form.addform{display:flex; flex-direction:column; gap:11px; margin-top:8px}
  form.addform label{font-size:13.5px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; gap:5px}
  form.addform input, form.addform select, form.addform textarea{font:inherit; font-size:15px; color:var(--ink);
    padding:10px 12px; border:1px solid var(--line); border-radius:11px; background:#fff; outline:none; font-weight:400}
  form.addform input:focus, form.addform select:focus, form.addform textarea:focus{border-color:var(--accent); box-shadow:var(--ring)}
  .formerr{display:none; background:var(--red-soft); color:var(--red); border-radius:10px; padding:9px 12px; font-size:13.5px}
  .formerr.show{display:block}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:#14351F; color:#D9F5E0;
    padding:11px 18px; border-radius:999px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:all .3s ease; z-index:80; box-shadow:var(--shadow); max-width:92vw; text-align:center}
  #toast.show{opacity:1; transform:translateX(-50%)}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  }

  /* Hàng đợi hôm nay: chip lọc môn + nhóm gập/mở + lưới 2 cột trên máy tính */
  .tchips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; margin-top:14px; scrollbar-width:none}
  .tchips::-webkit-scrollbar{display:none}
  .tchip{flex:0 0 auto; border:1.5px solid #E3E9F2; background:#fff; border-radius:999px; padding:7px 13px; font-weight:600; font-size:13.5px; cursor:pointer; color:#33415C}
  .tchip.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .grouphead{cursor:pointer; user-select:none}
  .grouphead .chev{margin-left:auto; color:var(--muted); font-size:13px; font-weight:500}
  .rows.collapsed{display:none}
  .gdetail{display:none}
  @media (min-width:1024px){
    .gaccord{display:none}
    .gdetail{display:grid; grid-template-columns:295px 1fr; gap:18px; align-items:start}
    .gside{display:flex; flex-direction:column; gap:8px}
    .gside-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:11px 13px; cursor:pointer; font:inherit}
    .gside-item.active{border-color:var(--accent); box-shadow:var(--shadow)}
    .gside-item .gs-meta{margin-left:auto; text-align:right; color:var(--muted); font-size:12.5px; line-height:1.5}
    .gside-item .gs-meta b{color:var(--ink); font-size:13.5px}
    .gside-item{flex-wrap:wrap}
    .gsbar{flex:1 1 100%; height:7px; background:var(--gray-soft); border-radius:99px; overflow:hidden}
    .gsbar i{display:block; height:100%; border-radius:99px; animation:none}

    .gmain .rows{max-height:560px; overflow-y:auto; padding-right:4px; scrollbar-width:thin}
    .rows.solo{max-height:560px; overflow-y:auto; padding-right:4px; scrollbar-width:thin}
  }

  /* Tab Tất cả bài học: danh sách nằm trong khung cuộn riêng, có thanh cuộn rõ ràng */
  @media (min-width:1024px){
    #allRows{max-height:calc(100vh - 215px); overflow-y:auto; padding:2px 6px 10px 2px; scrollbar-width:thin}
    #allRows::-webkit-scrollbar{width:8px}
    #allRows::-webkit-scrollbar-thumb{background:#C4CFDE; border-radius:99px}
    #allRows::-webkit-scrollbar-track{background:transparent}
  }

  /* Thanh tỉ lệ tự chạy hiệu ứng bằng CSS, không phụ thuộc JS gọi sau khi vẽ */
  .dist-row .bar i, .recallbox .bar i{animation:none}

  /* Thanh mức nhớ chạy ngang dưới mỗi dòng bài (như bên Thống kê) */
  .row{flex-wrap:wrap; row-gap:8px}
  .rowbar{flex:1 1 100%; height:7px; background:var(--gray-soft); border-radius:99px; overflow:hidden}
  .rowbar i{display:block; height:100%; border-radius:99px; animation:none}
  .grow2{display:flex; flex-direction:column; gap:8px; margin-bottom:10px}
  .gmain .grouphead:first-child{margin-top:4px}

    const o = wrapCenterOffset(wrap, e.clientX, e.clientY);
    zoomToTarget(imgZoom.ts * (e.deltaY < 0 ? 1.12 : 0.89), o[0], o[1]);
  }, { passive: false });
  let mDown = false, mX = 0, mY = 0, mTx = 0, mTy = 0;
  wrap.addEventListener("mousedown", function (e) { mDown = true; mX = e.clientX; mY = e.clientY; mTx = imgZoom.tx; mTy = imgZoom.ty; });
  wrap.addEventListener("mousemove", function (e) { if (!mDown || imgZoom.s <= 1) return; imgZoom.tx = mTx + (e.clientX - mX); imgZoom.ty = mTy + (e.clientY - mY); imgZoom.ttx = imgZoom.tx; imgZoom.tty = imgZoom.ty; clampImgZoom(); applyImgZoom(); });
  wrap.addEventListener("mouseup", function () { mDown = false; });
  wrap.addEventListener("mouseleave", function () { mDown = false; });
  wrap.addEventListener("dblclick", function (e) {
    const o = wrapCenterOffset(wrap, e.clientX, e.clientY);
    if (imgZoom.ts > 1) zoomToTarget(1, 0, 0); else zoomToTarget(2.5, o[0], o[1]);
  });
  const zi = document.getElementById("imgZoomIn"), zo = document.getElementById("imgZoomOut"), zr = document.getElementById("imgZoomReset");
  if (zi) zi.addEventListener("click", function () { zoomToTarget(imgZoom.ts * 1.35, 0, 0); });
  if (zo) zo.addEventListener("click", function () { zoomToTarget(imgZoom.ts / 1.35, 0, 0); });
  if (zr) zr.addEventListener("click", function () { zoomToTarget(1, 0, 0); });
}


function closeImg() { document.getElementById("imgOverlay").classList.remove("open"); }
function openTest() {
  const wrap = document.getElementById("imgFrameWrap");
  const u = "test-small.png";
  document.getElementById("imgOverlay").classList.add("open");
  wrap.innerHTML = '<div id="imgZoomWrap" style="position:relative;overflow:hidden;border-radius:6px;background:transparent;touch-action:none;width:fit-content;max-width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center">' +
      '<img id="imgZoomImg" src="' + u + '" alt="Ảnh tài liệu" draggable="false" style="max-width:100%;max-height:min(84vh,1400px);display:block;user-select:none;-webkit-user-drag:none;will-change:transform">' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap">' +
      '<button class="btn small" id="imgZoomOut" type="button">−</button>' +
      '<button class="btn small" id="imgZoomIn" type="button">＋</button>' +
      '<button class="btn small" id="imgZoomReset" type="button">Vừa khung</button>' +
      '<span style="color:rgba(255,255,255,.65);font-size:12.5px">Chụm 2 ngón để phóng to, kéo để xem, chạm 2 lần để về vừa khung</span></div>';
    wireImgZoom();
    wrap.onclick = function (e) { if (e.target === wrap) closeImg(); };
    const zim = document.getElementById("imgZoomImg");
    const zwrap = document.getElementById("imgZoomWrap");
    function fitImgFrame() {
      if (!zim || !zwrap || !zim.naturalWidth) return;
      const availW = zwrap.parentElement ? zwrap.parentElement.clientWidth : zwrap.clientWidth;
      const maxH = zwrap.parentElement ? Math.max(160, zwrap.parentElement.clientHeight - 54) : Math.min(window.innerHeight * 0.84, 1400);
      const sc = Math.min(availW / zim.naturalWidth, maxH / zim.naturalHeight);
      zwrap.style.width = Math.round(zim.naturalWidth * sc) + "px";
      zwrap.style.height = Math.round(zim.naturalHeight * sc) + "px";
      zwrap.style.margin = "0 auto";
      zim.style.width = "100%";
      zim.style.height = "100%";
      zim.style.maxHeight = "100%";
    }
    imgFitFn = fitImgFrame;
    fitImgFrame();
    if (zim) {
      zim.addEventListener("load", fitImgFrame);
      if (zim.decode) zim.decode().then(fitImgFrame).catch(function () {});
      requestAnimationFrame(fitImgFrame);
      setTimeout(fitImgFrame, 120);
    }
}
window.addEventListener("load", openTest);
